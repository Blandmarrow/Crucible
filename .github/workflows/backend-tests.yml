name: backend-tests

# Runs the backend test suite (backend/tests/). Installs only lightweight,
# pure-Python deps: numpy, pillow, pytest, plus the DB/web-layer packages the
# tests' import chains pull in — sqlalchemy, aiosqlite, greenlet, pydantic,
# pydantic-settings, fastapi, regex. The detection/mask tests import the ORM
# models (backend.database creates the async engine at import → aiosqlite +
# greenlet) and the export_service/utils helpers, so those deps are needed just
# to collect them.
#
# The second group — httpx, python-multipart, aiohttp, sse-starlette, psutil,
# imagehash, tiktoken — is what importing the real app costs. tests/conftest.py
# drives `backend.main.app` over httpx.ASGITransport, and that import pulls in
# every router: python-multipart (FastAPI refuses `UploadFile` params without
# it), sse-starlette (jobs), psutil (system), aiohttp (booru), imagehash and
# tiktoken (image/caption services). All are small and pure-Python-ish. A
# missing one fails at *collection*, taking down the whole suite rather than
# just the HTTP tests — which is exactly how this list was found to be short.
#
# Deliberately NO torch-sized / GPU deps: no test imports torch or an ML model.
# Keep it that way — if a new test needs torch-sized dependencies, reconsider the
# test design before growing this install step.
#
# cv2 is the one carve-out, installed as a separate step below. The video suite
# is ~250 tests and cv2 is its decode gate: without it three modules error at
# *collection* and the rest fail rather than skip, so leaving it out meant no
# video test was ever enforced here. Same reasoning e2e-smoke.yml gives for the
# same package. Note the deliberate divergence from backend/requirements.txt,
# which pins the GUI `opencv-python` for real use — do not "fix" CI back to it:
# that wheel links libGL.so.1, which a headless runner does not have.

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/check_migrations.py"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/check_migrations.py"
      - ".github/workflows/backend-tests.yml"

# Every job here only reads the repo and runs tests; nothing writes back to
# GitHub. Pin the token to the minimum so a compromised action or dependency
# cannot use it to push, comment, or publish.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: pip install numpy pillow sqlalchemy aiosqlite greenlet pydantic pydantic-settings fastapi regex httpx python-multipart aiohttp sse-starlette psutil imagehash tiktoken -r backend/requirements-dev.txt
      # Separate step so a failure here is legible on its own. Order matters:
      # opencv-python-headless first, then scenedetect WITHOUT its deps —
      # scenedetect hard-requires `opencv-python` (the GUI wheel, ~90 MB, links
      # libGL.so.1). Both wheels provide the same `cv2` package, so headless +
      # --no-deps + the three remaining runtime deps is the only combination that
      # gets shot detection without the GL-linked wheel. Installing cv2 *without*
      # scenedetect is not worth doing: the three scenedetect-gated modules are
      # ~70 tests and the bulk of the video HTTP coverage. imageio-ffmpeg stays
      # out: no test needs the real bwdif path — both 503 tests monkeypatch
      # `capabilities`.
      #
      # `--no-deps` discards scenedetect's own constraints along with its cv2
      # requirement, so the three deps it still needs are reinstated *with* the
      # one constraint that matters: scenedetect declares `click!=8.3.0,~=8.0`.
      # Unpinned, CI is green only for as long as latest click stays below 9 —
      # and would then break on a run detached from any change, the same failure
      # mode this file's header warns about for the main list.
      - name: Install video test dependencies
        run: |
          pip install opencv-python-headless
          pip install --no-deps scenedetect
          pip install "click!=8.3.0,~=8.0" platformdirs tqdm
      - name: Run backend tests
        run: python -m pytest backend/tests/ -q

  # Migration drift: `alembic upgrade head` on an empty DB must reproduce exactly
  # what the models declare. Separate job so a drift failure is legible on its own,
  # and because it needs `alembic` on top of the test dependency set (the same
  # augmentation e2e-smoke.yml makes). The models import chain is what the rest of
  # the list is for — see this file's header.
  #
  # This job is also the reason `check_migrations.py` must stay importable with no
  # pytest: it runs the dependency set directly, not under the test harness.
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      # Same base list as backend-tests above (and e2e-smoke.yml), plus alembic. Keep
      # all three in sync: a trimmed list here breaks only this job, and only whenever
      # `backend.models`' import chain later grows one of the omitted packages — a
      # failure that arrives detached from the change that caused it.
      - name: Install backend dependencies
        run: pip install numpy pillow sqlalchemy aiosqlite greenlet pydantic pydantic-settings fastapi regex httpx python-multipart aiohttp sse-starlette psutil imagehash tiktoken alembic
      - name: Check migrations against the models
        run: python scripts/check_migrations.py
