name: check-docs

# Runs the documentation drift check (scripts/check_docs.py), the docs-architecture v3.1
# reference checker with Crucible's settings in its CONFIG block. FAILs the build on broken
# markdown links and anchors, missing inline-code paths, the `@docs/`/`@CLAUDE` auto-load
# footgun, and a link whose label names one .md file but opens another. Word budgets,
# unrecorded split seams, paragraph length, Documentation Map coverage and word counts, and
# postmortem status sync are warnings only. The first step proves the checker still fails
# on seeded errors, so a broken checker cannot pass the docs silently.
#
# Deliberately stdlib-only: no install step. If a new check seems to need a package,
# reconsider the check's design before adding an install step here.
#
# No path filter on purpose: the check resolves paths the docs cite in backend/ and
# frontend/, so a code rename can break a doc without touching one. Until 2026-10-29 this
# workflow filtered on doc paths only, and such a PR never ran it. It runs in seconds. If
# you add a filter, include the docs, the source roots they reference,
# scripts/check_docs.py and this file, and keep the pull_request and push lists identical.

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes back to the repo. Pin the token to the minimum so a compromised
# action or dependency cannot use it to push, comment, or publish.
permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Drift check verifies itself (seeded errors must fail)
        run: python scripts/check_docs.py --self-test
      - name: Documentation drift check
        run: python scripts/check_docs.py
