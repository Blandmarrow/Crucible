name: frontend-build

# Type-checks and builds the frontend. `npm run build` (tsc -b && vite build) is
# the ONLY real typecheck: the root tsconfig is solution-style (files: [] + project
# references), so a bare `tsc --noEmit` sweeps nothing and exits 0 on code that does
# not compile. Build runs before lint because it is the higher-signal check.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

# Every job here only reads the repo and runs tests; nothing writes back to
# GitHub. Pin the token to the minimum so a compromised action or dependency
# cannot use it to push, comment, or publish.
permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc -b && vite build)
        run: npm run build
      # Lint is reported but NON-BLOCKING: the tree carries pre-existing
      # eslint debt (react-hooks/set-state-in-effect and exhaustive-deps from
      # the newer react-hooks ruleset), untouched by this workflow. The build
      # above is the hard typecheck gate; keep lint visible without turning the
      # check permanently red. Drop continue-on-error once the backlog is clear.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
