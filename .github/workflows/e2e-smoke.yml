name: e2e-smoke

# Playwright end-to-end smoke suite (frontend/e2e/). Runs the real SPA against a
# real backend on :8199 over a throwaway SQLite DB (frontend/e2e/serve.sh), so it
# is the ONLY CI check that catches an API change breaking the UI — hence it
# triggers on BOTH frontend/** and backend/**.
#
# The pip install is backend/requirements-ci.txt — the same pinned base file the
# two backend-tests.yml jobs install (see its header for why each package is
# needed to import backend.main) PLUS `uvicorn` and `alembic`, which serve.sh
# needs to migrate and serve the app. A missing backend dep does NOT fail loudly
# here — it surfaces as a Playwright "webServer timeout", which is why serve.sh's
# output is piped (stdout/stderr: "pipe" in playwright.config.ts) so the
# traceback is visible in the logs.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e-smoke.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e-smoke.yml"

# Every job here only reads the repo and runs tests; nothing writes back to
# GitHub. Pin the token to the minimum so a compromised action or dependency
# cannot use it to push, comment, or publish.
permissions:
  contents: read

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-ci.txt
            backend/requirements-dev.txt
      # `opencv-python-headless` is added on top of the shared base file, and not
      # put *into* it, for one reason: cv2 is the video *ingest gate*, so without
      # it a video upload 400s rather than being skipped, and video-extract.spec.ts
      # would fail rather than degrade. `scenedetect` and `imageio-ffmpeg` stay
      # absent on purpose — that makes CI exercise the `capabilities: false`
      # branches (the disabled deinterlace toggle, the fixed-interval-sampling
      # warning) for real, which is the deliberate divergence from
      # backend-tests.yml. Headless because there is no display; ~60 MB and ~20 s.
      - name: Install backend dependencies
        run: pip install -r backend/requirements-ci.txt "uvicorn[standard]>=0.48" "alembic>=1.13" "opencv-python-headless>=4.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend (e2e serves the built dist)
        working-directory: frontend
        run: npm run build
      - name: Install Playwright chromium + OS deps
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke suite
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
