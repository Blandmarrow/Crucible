name: backend-tests

# Runs the backend test suite (backend/tests/). Installs only lightweight,
# pure-Python deps: numpy, pillow, pytest, plus the DB/web-layer packages the
# tests' import chains pull in — sqlalchemy, aiosqlite, greenlet, pydantic,
# pydantic-settings, fastapi, regex. The detection/mask tests import the ORM
# models (backend.database creates the async engine at import → aiosqlite +
# greenlet) and the export_service/utils helpers, so those deps are needed just
# to collect them.
#
# The second group — httpx, python-multipart, aiohttp, sse-starlette, psutil,
# imagehash, tiktoken — is what importing the real app costs. tests/conftest.py
# drives `backend.main.app` over httpx.ASGITransport, and that import pulls in
# every router: python-multipart (FastAPI refuses `UploadFile` params without
# it), sse-starlette (jobs), psutil (system), aiohttp (booru), imagehash and
# tiktoken (image/caption services). All are small and pure-Python-ish. A
# missing one fails at *collection*, taking down the whole suite rather than
# just the HTTP tests — which is exactly how this list was found to be short.
#
# Deliberately NO torch-sized / GPU / cv2 deps: technical_scorer
# imports cv2 lazily inside score_technical_sync, and no test imports torch or an
# ML model. Keep it that way — if a new test needs torch-sized dependencies,
# reconsider the test design before growing this install step.

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/check_migrations.py"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/check_migrations.py"
      - ".github/workflows/backend-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: pip install numpy pillow sqlalchemy aiosqlite greenlet pydantic pydantic-settings fastapi regex httpx python-multipart aiohttp sse-starlette psutil imagehash tiktoken -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests/ -q

  # Migration drift: `alembic upgrade head` on an empty DB must reproduce exactly
  # what the models declare. Separate job so a drift failure is legible on its own,
  # and because it needs `alembic` on top of the test dependency set (the same
  # augmentation e2e-smoke.yml makes). The models import chain is what the rest of
  # the list is for — see this file's header.
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install numpy pillow sqlalchemy aiosqlite greenlet pydantic pydantic-settings fastapi regex tiktoken alembic
      - name: Check migrations against the models
        run: python scripts/check_migrations.py
